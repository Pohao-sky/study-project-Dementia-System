<div class="elder-login-container">
  <h2>用戶登入</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="elder-form">
    <label>帳號：</label>
    <input
      formControlName="username"
      required
      class="elder-input"
      placeholder="請輸入帳號"
      autocomplete="username"
    />

    <label>密碼：</label>
    <input
      formControlName="password"
      required
      type="password"
      class="elder-input"
      placeholder="請輸入密碼"
      autocomplete="current-password"
    />

    <button
      type="submit"
      [disabled]="loginForm.invalid"
      class="elder-btn"
    >
      登入
    </button>
  </form>

  @if(infoMsg){
    <div class="elder-info">{{infoMsg}}</div>
  }
  @if(errorMsg){
    <div class="elder-error">{{errorMsg}}</div>
  }

  <div class="manual-container">
    <p class="divider">系統手冊</p>
    <div class="manual-buttons">
      <a href="/失智症檢測系統使用手冊.pdf" download="失智症檢測系統使用手冊.pdf" class="manual-btn">
        📥 下載使用手冊
      </a>
      <a href="/失智症檢測系統維護手冊.pdf" download="失智症檢測系統系統維護手冊.pdf" class="manual-btn">
        📥 下載維護手冊
      </a>
    </div>
  </div>

  <a routerLink="/guest-mode" class="guest-link">訪客模式登入</a>
</div>
